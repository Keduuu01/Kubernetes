name: Deploy to EKS

on:
  push:
    branches: [ main ] # Change to your default branch if different (e.g., master)

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change to your specific AWS region (e.g., us-west-2)

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name <Kedar01> --region <us-east-1>

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -f manifests/
          # Apply your Kubernetes deployment, service, and ingress manifests
          kubectl apply -f k8s/
          
          # Verification: Check deployment status
          kubectl get pods
          kubectl get ingress
