name: Provision EKS and Deploy Day 9

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "387158738772"
  EKS_CLUSTER_NAME: naresh
  TF_WORKING_DIR: Day-8-Terraform-EKS
  DAY9_DIR: Day-9-Ingress-Path-Base-Deployment
  DOMAIN_NAME: 387158738772.realhandsonlabs.net
  ROUTE53_HOSTED_ZONE_ID: Z06215901T214MQUZZPCK
  LBC_ROLE_NAME: AmazonEKSLoadBalancerControllerRole
  LBC_POLICY_NAME: AWSLoadBalancerControllerIAMPolicy
  LBC_POLICY_VERSION: v2.14.1

jobs:
  deploy:
    name: Create EKS, HTTPS ALB and Day 9 apps
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::387158738772:role/GitHubActions-EKS-Role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsEKSDeployment

      - name: Verify AWS account
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          echo "Authenticated AWS account: $ACTUAL_ACCOUNT"
          if [[ "$ACTUAL_ACCOUNT" != "$AWS_ACCOUNT_ID" ]]; then
            echo "Wrong AWS account. Expected $AWS_ACCOUNT_ID."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -reconfigure             -backend-config="bucket=kubernetes-tfstate-387158738772-us-east-1"             -backend-config="key=eks/terraform.tfstate"             -backend-config="region=${AWS_REGION}"             -backend-config="encrypt=true"             -backend-config="use_lockfile=true"

      - name: Terraform validate and plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check
          terraform validate
          terraform plan -out=tfplan

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Export Terraform outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "VPC_ID=$(terraform output -raw vpc_id)" >> "$GITHUB_ENV"
          echo "EKS_CLUSTER_NAME=$(terraform output -raw cluster_name)" >> "$GITHUB_ENV"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Install eksctl
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 3 -fsSL             "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz"             -o /tmp/eksctl.tar.gz
          tar -xzf /tmp/eksctl.tar.gz -C /tmp
          sudo install -m 0755 /tmp/eksctl /usr/local/bin/eksctl
          eksctl version

      - name: Connect kubectl to EKS
        run: |
          aws eks wait cluster-active --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          kubectl get nodes

      - name: Create IAM policy and IRSA role for AWS Load Balancer Controller
        shell: bash
        run: |
          set -euo pipefail

          POLICY_ARN="arn:aws:iam::$AWS_ACCOUNT_ID:policy/$LBC_POLICY_NAME"

          eksctl utils associate-iam-oidc-provider             --region "$AWS_REGION"             --cluster "$EKS_CLUSTER_NAME"             --approve

          if ! aws iam get-policy --policy-arn "$POLICY_ARN" >/dev/null 2>&1; then
            curl --retry 5 --retry-delay 3 -fsSL               "https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/$LBC_POLICY_VERSION/docs/install/iam_policy.json"               -o /tmp/lbc-iam-policy.json
            aws iam create-policy               --policy-name "$LBC_POLICY_NAME"               --policy-document file:///tmp/lbc-iam-policy.json
          fi

          if ! aws iam get-role --role-name "$LBC_ROLE_NAME" >/dev/null 2>&1; then
            eksctl create iamserviceaccount               --cluster "$EKS_CLUSTER_NAME"               --region "$AWS_REGION"               --namespace kube-system               --name aws-load-balancer-controller               --role-name "$LBC_ROLE_NAME"               --attach-policy-arn "$POLICY_ARN"               --override-existing-serviceaccounts               --approve
          fi

          aws iam attach-role-policy             --role-name "$LBC_ROLE_NAME"             --policy-arn "$POLICY_ARN"

          kubectl create serviceaccount aws-load-balancer-controller             --namespace kube-system             --dry-run=client -o yaml | kubectl apply -f -

          kubectl annotate serviceaccount aws-load-balancer-controller             --namespace kube-system             "eks.amazonaws.com/role-arn=arn:aws:iam::$AWS_ACCOUNT_ID:role/$LBC_ROLE_NAME"             --overwrite

      - name: Install AWS Load Balancer Controller
        run: |
          set -euo pipefail
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller             eks/aws-load-balancer-controller             --version 1.14.0             --namespace kube-system             --set clusterName="$EKS_CLUSTER_NAME"             --set region="$AWS_REGION"             --set vpcId="$VPC_ID"             --set serviceAccount.create=false             --set serviceAccount.name=aws-load-balancer-controller             --wait             --timeout 10m

          kubectl rollout status deployment/aws-load-balancer-controller             --namespace kube-system             --timeout=10m

      - name: Create ECR repositories
        shell: bash
        run: |
          set -euo pipefail
          for REPOSITORY in main aws azure gcp; do
            if ! aws ecr describe-repositories               --repository-names "$REPOSITORY"               --region "$AWS_REGION" >/dev/null 2>&1; then
              aws ecr create-repository                 --repository-name "$REPOSITORY"                 --region "$AWS_REGION" >/dev/null
            fi
          done

      - name: Build and push application images
        shell: bash
        run: |
          set -euo pipefail
          ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

          docker build -t "$ECR_REGISTRY/main:latest" "./$DAY9_DIR"
          docker build -t "$ECR_REGISTRY/aws:latest" "./$DAY9_DIR/aws"
          docker build -t "$ECR_REGISTRY/azure:latest" "./$DAY9_DIR/azure"
          docker build -t "$ECR_REGISTRY/gcp:latest" "./$DAY9_DIR/gcp"

          docker push "$ECR_REGISTRY/main:latest"
          docker push "$ECR_REGISTRY/aws:latest"
          docker push "$ECR_REGISTRY/azure:latest"
          docker push "$ECR_REGISTRY/gcp:latest"

      - name: Update image references in Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_DIR="./$DAY9_DIR/k8s-files"
          ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          sed -i -E             "s#[0-9]{12}\.dkr\.ecr\.[^/]+\.amazonaws\.com#$ECR_REGISTRY#g"             "$MANIFEST_DIR"/*.yml
          grep -n "image:" "$MANIFEST_DIR"/*.yml

      - name: Deploy applications
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_DIR="./$DAY9_DIR/k8s-files"

          kubectl apply -f "$MANIFEST_DIR/main.yml"
          kubectl apply -f "$MANIFEST_DIR/aws.yml"
          kubectl apply -f "$MANIFEST_DIR/azure.yml"
          kubectl apply -f "$MANIFEST_DIR/gcp.yml"

          kubectl rollout status deployment/main-deployment --timeout=5m
          kubectl rollout status deployment/aws-deployment --timeout=5m
          kubectl rollout status deployment/azure-deployment --timeout=5m
          kubectl rollout status deployment/gcp-deployment --timeout=5m

          kubectl apply -f "$MANIFEST_DIR/ingress.yml"

      - name: Wait for ALB and configure Route 53
        shell: bash
        run: |
          set -euo pipefail

          ALB_DNS=""
          for ATTEMPT in $(seq 1 60); do
            ALB_DNS="$(kubectl get ingress k8s-ingress               --output jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            if [[ -n "$ALB_DNS" ]]; then
              break
            fi
            echo "Waiting for ALB hostname ($ATTEMPT/60)..."
            sleep 15
          done

          if [[ -z "$ALB_DNS" ]]; then
            echo "ALB hostname was not assigned. Ingress/controller events:"
            kubectl describe ingress k8s-ingress || true
            kubectl logs deployment/aws-load-balancer-controller -n kube-system --tail=100 || true
            exit 1
          fi

          echo "ALB DNS: $ALB_DNS"

          ALB_INFO="$(aws elbv2 describe-load-balancers             --region "$AWS_REGION"             --query "LoadBalancers[?DNSName=='$ALB_DNS'] | [0].[CanonicalHostedZoneId,LoadBalancerArn]"             --output text)"

          read -r ALB_CANONICAL_ZONE_ID ALB_ARN <<< "$ALB_INFO"

          if [[ -z "$ALB_CANONICAL_ZONE_ID" || "$ALB_CANONICAL_ZONE_ID" == "None" ]]; then
            echo "Could not find ALB canonical hosted zone ID."
            exit 1
          fi

          jq -n             --arg domain "$DOMAIN_NAME"             --arg dns "$ALB_DNS"             --arg target_zone "$ALB_CANONICAL_ZONE_ID"             '{
              Changes: [{
                Action: "UPSERT",
                ResourceRecordSet: {
                  Name: $domain,
                  Type: "A",
                  AliasTarget: {
                    HostedZoneId: $target_zone,
                    DNSName: ("dualstack." + $dns),
                    EvaluateTargetHealth: true
                  }
                }
              }]
            }' > /tmp/route53-change.json

          CHANGE_ID="$(aws route53 change-resource-record-sets             --hosted-zone-id "$ROUTE53_HOSTED_ZONE_ID"             --change-batch file:///tmp/route53-change.json             --query 'ChangeInfo.Id' --output text)"

          aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"
          echo "Route 53 alias updated: https://$DOMAIN_NAME"

      - name: Verify HTTPS routes
        shell: bash
        run: |
          set -euo pipefail
          for PATH_TO_TEST in / /aws /azure /gcp; do
            echo "Checking https://$DOMAIN_NAME$PATH_TO_TEST"
            curl --fail --silent --show-error               --retry 20 --retry-delay 15 --retry-connrefused --retry-all-errors               "https://$DOMAIN_NAME$PATH_TO_TEST" -o /dev/null
          done

          echo "All four HTTPS routes returned HTTP success."
          kubectl get nodes
          kubectl get pods -o wide
          kubectl get services
          kubectl get ingress
