apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:387158738772:certificate/8e2e078b-32f2-47e4-a39c-e0bbe6d20c8e
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - host: 387158738772.realhandsonlabs.net
      http:
        paths:
          - path: /aws
            pathType: Prefix
            backend:
              service:
                name: aws-service
                port:
                  number: 80
          - path: /azure
            pathType: Prefix
            backend:
              service:
                name: azure-service
                port:
                  number: 80
          - path: /gcp
            pathType: Prefix
            backend:
              service:
                name: gcp-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: main-service
                port:
                  number: 80
